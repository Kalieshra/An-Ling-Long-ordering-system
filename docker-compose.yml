services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host port mapping is in docker-compose.override.yml (auto-loaded);
    # delete or edit the override if your host already runs Postgres on 5432.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host port mapping is in docker-compose.override.yml (auto-loaded).

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYERS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - staticfiles:/app/backend/staticfiles
      - mediafiles:/app/backend/mediafiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn rms.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload --access-logfile -"
    # Host port mapping is in docker-compose.override.yml.

  asgi:
    build:
      context: .
      dockerfile: docker/Dockerfile.asgi
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYERS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        # Wait for `web` to start so its `manage.py migrate` runs first; otherwise
        # daphne can answer requests against an empty schema on first boot.
        condition: service_started
    volumes:
      - ./backend:/app/backend
    command: daphne -b 0.0.0.0 -p 9000 rms.asgi:application
    # Host port mapping is in docker-compose.override.yml.

volumes:
  pgdata:
  redisdata:
  staticfiles:
  mediafiles:
