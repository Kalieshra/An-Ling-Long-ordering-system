# Auto-loaded by `docker compose up`. Maps db/redis to host ports for local tooling
# (psql, redis-cli, host-side pytest using DATABASE_URL=localhost:5432). If your host
# already runs Postgres or Redis on these ports, comment the offending mapping(s) or
# bypass this file entirely:
#   docker compose -f docker-compose.yml up
services:
  db:
    ports:
      # Host:15432 → container:5432 — non-default to avoid clashing with a host Postgres
      - "15432:5432"
  redis:
    ports:
      # Host:16379 → container:6379 — non-default to avoid clashing with a host Redis
      - "16379:6379"
  web:
    ports:
      # Host:18000 → container:8000 — non-default to avoid clashing with a host service
      - "18000:8000"
  asgi:
    ports:
      # Host:19000 → container:9000
      - "19000:9000"
