{% extends "base.html" %}
{% block title %}Admin Dashboard — RMS{% endblock %}
{% block content %}
<h1>Admin Dashboard</h1>
<p class="text-muted">Role: {{ user_role }}</p>

<div class="row g-3 mt-3">
  <div class="col-md-4">
    <a href="{% url 'menu:category-list' %}" class="card text-decoration-none">
      <div class="card-body">
        <h5 class="card-title">Categories</h5>
        <p class="card-text text-muted">Group dishes and drinks.</p>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="{% url 'menu:menuitem-list' %}" class="card text-decoration-none">
      <div class="card-body">
        <h5 class="card-title">Menu items</h5>
        <p class="card-text text-muted">Dishes, drinks, modifiers, prices.</p>
      </div>
    </a>
  </div>
  <div class="col-md-4">
    <a href="#" class="card text-decoration-none"><!-- TODO Task 10: restore url menu:ingredient-list -->
      <div class="card-body">
        <h5 class="card-title">Inventory</h5>
        <p class="card-text text-muted">Ingredient stock, low alerts.</p>
      </div>
    </a>
  </div>
</div>
{% endblock %}
