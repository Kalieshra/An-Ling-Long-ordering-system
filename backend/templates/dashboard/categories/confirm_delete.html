{% extends "base.html" %}
{% block title %}Delete category — RMS{% endblock %}
{% block content %}
<h1>Delete "{{ object.name }}"?</h1>
<p class="text-muted">Items in this category will block deletion. Deactivate instead if you have items.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Delete permanently</button>
  <a class="btn btn-link" href="{% url 'menu:category-list' %}">Cancel</a>
</form>
{% endblock %}
