{% extends "base.html" %}
{% block title %}Delete ingredient — RMS{% endblock %}
{% block content %}
<h1>Delete "{{ object.name }}"?</h1>
<p class="text-muted">If any recipe uses this ingredient, deletion is blocked.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Delete permanently</button>
  <a class="btn btn-link" href="{% url 'menu:ingredient-list' %}">Cancel</a>
</form>
{% endblock %}
